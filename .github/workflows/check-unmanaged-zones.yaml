name: Check Unmanaged Zones

on:
  schedule:
    - cron: "0 0 * * 1-5" # Runs at 00:00 from Monday to Friday
  workflow_dispatch: # Allows manual triggering

permissions: {}

jobs:
  check-zones:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          make install

      - name: Run check for unmanaged zones
        id: check-zones
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCTODNS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCTODNS_AWS_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: 1
        run: |
          set -o pipefail
          if make check-unmanaged-zones 2>&1 | tee /tmp/check-unmanaged-zones.log; then
            status=0
          else
            status=$?
          fi
          {
            echo "result<<EOF"
            cat /tmp/check-unmanaged-zones.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$status"
